# OSmosis scanner configuration (Slice 1).
#
# Every key shown here is also the embedded default. Pass this file (or your own
# edited copy) with `--config <file>`; any key you omit keeps its default value.
#
# NOTE: this file uses a restricted TOML subset (sections, "key" = "value" string
# pairs, integers, and arrays of strings) so the scanner can parse it without
# pulling in an extra TOML dependency crate.

# Files at or below this size are hashed with xxh64. Larger KEEP files get
# hash = null and hash_status = "deferred_large_file".
# 256 MiB:
hash_max_bytes = 268435456

# (1) Explicit KEEP mappings: windows-relative prefix -> linux destination prefix.
# Matched case-insensitively on path-component boundaries, longest prefix first.
# ".ssh" is also listed under [sensitive_mappings] below.
[keep_mappings]
"Documents" = "~/Documents"
"Desktop" = "~/Desktop"
"Pictures" = "~/Pictures"
"Videos" = "~/Videos"
"Music" = "~/Music"
"Downloads" = "~/Downloads"
".ssh" = "~/.ssh"
".gitconfig" = "~/.gitconfig"
"AppData/Roaming/.minecraft" = "~/.minecraft"
"AppData/Roaming/.tlauncher" = "~/.tlauncher"
"AppData/Roaming/.fastclient" = "~/.fastclient"
"AppData/Roaming/FastClient" = "~/.config/FastClient"
"AppData/Roaming/Telegram Desktop" = "~/.local/share/TelegramDesktop"
"AppData/Roaming/Mozilla" = "~/.mozilla"
"AppData/Roaming/ai.opencode.desktop" = "~/.local/share/ai.opencode.desktop"
"AppData/Roaming/Antigravity IDE/User" = "~/.config/Antigravity IDE/User"
"AppData/Roaming/Code/User" = "~/.config/Code/User"
"AppData/Local/Google/Chrome/User Data/Default" = "~/.config/google-chrome/Default"

# KEEP mappings whose entries are flagged sensitive = true in the manifest.
[sensitive_mappings]
prefixes = [".ssh", "AppData/Roaming/Telegram Desktop", "AppData/Roaming/Mozilla", "AppData/Local/Google/Chrome/User Data/Default"]

# (2) RECREATE directory names (case-insensitive). A matching directory is NOT
# descended into; it is recorded as ONE aggregate entry (path, total bytes, file
# count) and pruned from the walk. Note: a `.git` directory is never RECREATE —
# it is always aggregated as KEEP.
[recreate_dirs]
names = ["node_modules", ".next", ".turbo", ".cache", "target", "__pycache__", ".venv", "dist", "out"]

# (3) SKIP rules, evaluated after KEEP mappings and RECREATE pruning.
[skip]
# Everything under this top-level folder is skipped unless a KEEP mapping above
# matched first (e.g. AppData/Roaming/Code/User).
appdata_root = "AppData"
# Exact file names to skip (case-insensitive).
names = ["ntuser.ini", "thumbs.db", "desktop.ini"]
# File-name prefixes to skip (case-insensitive), e.g. NTUSER.DAT, NTUSER.DAT.LOG1...
prefix_names = ["ntuser.dat"]
# File extensions to skip (case-insensitive, with leading dot).
extensions = [".tmp", ".sys"]
