[package]
name = "osmosis"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "OSmosis - move from Windows to Linux, without losing anything. Slice 1: read-only scanner that builds a migration manifest."
repository = "https://github.com/mateir0/osmosis"

[dependencies]
clap = { version = "=4.6.8", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
walkdir = "=2.5.0"
xxhash-rust = { version = "=0.8.21", features = ["xxh64"] }
fs2 = "=0.4.3"
chrono = "=0.4.45"
rusqlite = { version = "=0.43.0", features = ["bundled"] }

[profile.release]
opt-level = 2
